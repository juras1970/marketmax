<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — MarketMax</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        'ml-yellow': '#FFE600', 'ml-blue': '#3483FA', 'ml-green': '#00A650', 'ml-red': '#E63535',
      } } }
    }
  </script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="min-h-screen flex flex-col">

  <div id="site-header"></div>

  <main class="flex-1 w-full max-w-[420px] mx-auto px-4 py-10">
    <div class="bg-white rounded-lg shadow-sm p-6 md:p-8">
      <h1 class="text-2xl font-semibold text-[--ml-text] text-center mb-1">Entrar</h1>
      <p class="text-sm text-[--ml-text-light] text-center mb-6">Acesse sua conta MarketMax</p>

      <form id="login-form" class="space-y-4">
        <div>
          <label for="email" class="text-xs font-medium text-[--ml-text-light]">E-mail</label>
          <input id="email" type="email" required autocomplete="email"
            class="w-full mt-1 px-3 py-2.5 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-[--ml-blue] focus:border-transparent" />
        </div>
        <div>
          <label for="password" class="text-xs font-medium text-[--ml-text-light]">Senha</label>
          <input id="password" type="password" required autocomplete="current-password"
            class="w-full mt-1 px-3 py-2.5 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-[--ml-blue] focus:border-transparent" />
          <div class="text-right mt-1.5">
            <a href="/esqueci-senha.html" class="text-xs text-[--ml-blue] hover:underline">Esqueci minha senha</a>
          </div>
        </div>

        <p id="login-error" class="hidden text-sm text-[--ml-red] bg-red-50 border border-red-100 rounded-md px-3 py-2"></p>

        <button id="login-submit" type="submit"
          class="w-full bg-[--ml-blue] hover:bg-blue-600 text-white font-semibold py-2.5 rounded-md transition">
          Entrar
        </button>
      </form>

      <div class="mt-4 pt-4 border-t border-gray-100 text-center text-sm text-[--ml-text-light]">
        Ainda não tem conta?
        <a href="/cadastro.html" class="text-[--ml-blue] font-medium hover:underline">Cadastre-se</a>
      </div>

      <div class="mt-4 bg-blue-50 border border-blue-100 rounded-md px-3 py-2.5 text-xs text-[--ml-text-light]">
        <p class="font-semibold text-[--ml-text] mb-1">Contas de demonstração:</p>
        <p>Comprador: ricardo@marketmax.com / demo123</p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (auth.isLoggedIn()) {
        window.location.href = '/index.html';
        return;
      }

      const form = document.getElementById('login-form');
      const errorEl = document.getElementById('login-error');
      const submitBtn = document.getElementById('login-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Entrando...';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
          const result = await api.auth.login(email, password);
          auth.setSession(result.token, result.user);
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get('redirect') || '/index.html';
          window.location.href = redirect;
        } catch (err) {
          errorEl.textContent = err.message || 'Não foi possível entrar. Verifique seus dados.';
          errorEl.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Entrar';
        }
      });
    });
  </script>
</body>
</html>
