<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta — MarketMax</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        'ml-yellow': '#FFE600', 'ml-blue': '#3483FA', 'ml-green': '#00A650', 'ml-red': '#E63535',
      } } }
    }
  </script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="min-h-screen flex flex-col">

  <div id="site-header"></div>

  <main class="flex-1 w-full max-w-[420px] mx-auto px-4 py-10">
    <div class="bg-white rounded-lg shadow-sm p-6 md:p-8">
      <h1 class="text-2xl font-semibold text-[--ml-text] text-center mb-1">Criar conta</h1>
      <p class="text-sm text-[--ml-text-light] text-center mb-6">Cadastre-se para comprar e favoritar produtos</p>

      <form id="register-form" class="space-y-4">
        <div>
          <label for="name" class="text-xs font-medium text-[--ml-text-light]">Nome completo</label>
          <input id="name" type="text" required autocomplete="name"
            class="w-full mt-1 px-3 py-2.5 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-[--ml-blue] focus:border-transparent" />
        </div>
        <div>
          <label for="email" class="text-xs font-medium text-[--ml-text-light]">E-mail</label>
          <input id="email" type="email" required autocomplete="email"
            class="w-full mt-1 px-3 py-2.5 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-[--ml-blue] focus:border-transparent" />
        </div>
        <div>
          <label for="password" class="text-xs font-medium text-[--ml-text-light]">Senha</label>
          <input id="password" type="password" required minlength="6" autocomplete="new-password"
            class="w-full mt-1 px-3 py-2.5 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-[--ml-blue] focus:border-transparent" />
          <p class="text-[11px] text-[--ml-text-light] mt-1">Mínimo de 6 caracteres.</p>
        </div>
        <div>
          <label for="password-confirm" class="text-xs font-medium text-[--ml-text-light]">Confirmar senha</label>
          <input id="password-confirm" type="password" required minlength="6" autocomplete="new-password"
            class="w-full mt-1 px-3 py-2.5 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-[--ml-blue] focus:border-transparent" />
        </div>

        <p id="register-error" class="hidden text-sm text-[--ml-red] bg-red-50 border border-red-100 rounded-md px-3 py-2"></p>

        <button id="register-submit" type="submit"
          class="w-full bg-[--ml-blue] hover:bg-blue-600 text-white font-semibold py-2.5 rounded-md transition">
          Criar conta
        </button>
      </form>

      <div class="mt-4 pt-4 border-t border-gray-100 text-center text-sm text-[--ml-text-light]">
        Já tem uma conta?
        <a href="/login.html" class="text-[--ml-blue] font-medium hover:underline">Entrar</a>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (auth.isLoggedIn()) {
        window.location.href = '/index.html';
        return;
      }

      const form = document.getElementById('register-form');
      const errorEl = document.getElementById('register-error');
      const submitBtn = document.getElementById('register-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.classList.add('hidden');

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const passwordConfirm = document.getElementById('password-confirm').value;

        if (password !== passwordConfirm) {
          errorEl.textContent = 'As senhas não coincidem.';
          errorEl.classList.remove('hidden');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Criando conta...';

        try {
          const result = await api.auth.register(name, email, password);
          auth.setSession(result.token, result.user);
          toast('Conta criada com sucesso! Bem-vindo(a) ao MarketMax.');
          window.location.href = '/index.html';
        } catch (err) {
          errorEl.textContent = err.message || 'Não foi possível criar a conta.';
          errorEl.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Criar conta';
        }
      });
    });
  </script>
</body>
</html>
