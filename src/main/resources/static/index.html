<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1976D2">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarketMax — Compre tudo com os melhores preços</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'ml-yellow': '#FFE600',
            'ml-blue': '#3483FA',
            'ml-green': '#00A650',
            'ml-red': '#E63535',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="min-h-screen flex flex-col">

  <div id="site-header"></div>

  <main class="flex-1 w-full max-w-[1200px] mx-auto px-4 pb-12">

    <!-- Banner promocional -->
    <section id="banner" class="mt-4 rounded-lg overflow-hidden relative h-40 md:h-56 bg-gradient-to-r from-[--ml-blue] to-[#1e5fd6] flex items-center px-6 md:px-10">
      <div class="text-white max-w-md">
        <p id="banner-eyebrow" class="text-xs md:text-sm font-semibold uppercase tracking-wide text-yellow-300">Ofertas por tempo limitado</p>
        <h1 id="banner-title" class="text-xl md:text-3xl font-extrabold mt-1 leading-tight">Os melhores preços em eletrônicos, moda e casa</h1>
        <a href="#ofertas" class="inline-block mt-3 bg-[--ml-yellow] text-[#2D2D2D] text-sm font-bold px-4 py-2 rounded-md hover:bg-yellow-300 transition">Ver ofertas</a>
      </div>
    </section>

    <!-- BANNER DE DOWNLOAD DO APK (EXIBIDO APENAS NO ANDROID) -->
    <div id="container-apk" class="mt-4 flex justify-center">
      <a id="btnDownloadApk" 
         href="/downloads/marketmax.apk" 
         download="MarketMax.apk" 
         class="btn-apk w-full bg-blue-50 border border-blue-200 text-blue-700 hover:bg-blue-100 font-semibold px-4 py-3 rounded-lg text-center flex items-center justify-between shadow-sm transition-all"
         style="display: none;">
        <span class="flex items-center gap-2 text-sm md:text-base">
          📱 <span>Baixe o <strong>App MarketMax</strong> para Android</span>
        </span>
        <span class="bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded-md shadow">
          Baixar APK
        </span>
      </a>
    </div>

    <!-- Barra de busca ativa -->
    <div id="search-context" class="hidden mt-6 flex items-center justify-between">
      <h2 id="search-title" class="text-lg font-semibold text-[--ml-text]"></h2>
      <button id="clear-search" class="text-sm text-[--ml-blue] hover:underline">Limpar filtro</button>
    </div>

    <!-- Categorias em destaque -->
    <section id="categories-section" class="mt-8">
      <h2 class="text-lg font-bold text-[--ml-text] mb-3">Categorias</h2>
      <div id="categories-grid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-3"></div>
    </section>

    <!-- Ofertas do dia -->
    <section id="ofertas" class="mt-10">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-bold text-[--ml-text] flex items-center gap-2">🔥 Ofertas do dia</h2>
        <span class="text-xs text-[--ml-text-light]">Preços com desconto por tempo limitado</span>
      </div>
      <div id="promotions-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3"></div>
    </section>

    <!-- Grid geral / resultado de busca -->
    <section class="mt-10">
      <h2 id="products-heading" class="text-lg font-bold text-[--ml-text] mb-3">Mais vendidos</h2>
      <div id="products-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3"></div>
      <p id="empty-state" class="hidden text-center text-[--ml-text-light] py-16">
        Nenhum produto encontrado para essa busca.
      </p>
    </section>

  </main>

  <div id="site-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/product-card.js"></script>
  <script src="/js/home.js"></script>
  
<script>
  // 1. Registro do Service Worker
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("/service-worker.js")
        .then(() => console.log("MarketMax PWA ativado"))
        .catch((error) =>
          console.error("Erro ao registrar Service Worker:", error)
        );
    });
  }

  // 2. Controle de exibição do botão APK
  document.addEventListener("DOMContentLoaded", () => {
    const btnApk = document.getElementById("btnDownloadApk");

    if (!btnApk) return;

    // Detecta se é um sistema Android
    const isAndroid = /Android/i.test(navigator.userAgent);

    // Detecta se a tela é menor que 768px (útil para simulação no DevTools)
    //const isMobileSize = window.innerWidth < 768;

    // Exibe o botão se for Android OU se estiver emulando tela mobile
    if (isAndroid || isMobileSize) {
      btnApk.style.display = "flex";
    }
  });
  
  //Menu Hamburguer
  document.addEventListener("DOMContentLoaded", () => {
	  const btnHamburger = document.getElementById("btn-hamburger");
	  const btnCloseMenu = document.getElementById("btn-close-menu");
	  const menuOverlay = document.getElementById("mobile-menu-overlay");
	  const menuDrawer = document.getElementById("mobile-menu-drawer");

	  function openMenu() {
	    menuOverlay.classList.remove("hidden");
	    setTimeout(() => {
	      menuDrawer.classList.remove("-translate-x-full");
	    }, 10);
	  }

	  function closeMenu() {
	    menuDrawer.classList.add("-translate-x-full");
	    setTimeout(() => {
	      menuOverlay.classList.add("hidden");
	    }, 300);
	  }

	  if (btnHamburger && btnCloseMenu && menuOverlay) {
	    btnHamburger.addEventListener("click", openMenu);
	    btnCloseMenu.addEventListener("click", closeMenu);
	    menuOverlay.addEventListener("click", (e) => {
	      if (e.target === menuOverlay) closeMenu();
	    });
	  }
	});
</script>
  
</body>
</html>
