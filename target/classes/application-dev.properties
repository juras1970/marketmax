# ===========================
# MarketMax - Application Config
# ===========================

# Server
server.port=8080
spring.application.name=marketmax-backend

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/marketmax
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

# SQL Init (data.sql runs after Hibernate creates schema)
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=non-null

# Logging
logging.level.com.marketmax=INFO
logging.level.org.springframework.web=WARN

# SpringDoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# JWT (login com token)
# IMPORTANT: em produção, substitua por um valor secreto forte via variável de ambiente.
marketmax.jwt.secret=${JWT_SECRET:MarketMaxSuperSecretKeyForJwtSigning2024ChangeInProductionPlease123456}
marketmax.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

