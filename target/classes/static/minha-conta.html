<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha conta — MarketMax</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        'ml-yellow': '#FFE600', 'ml-blue': '#3483FA', 'ml-green': '#00A650', 'ml-red': '#E63535',
      } } }
    }
  </script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="min-h-screen flex flex-col">

  <div id="site-header"></div>

  <main class="flex-1 w-full max-w-[1000px] mx-auto px-4 py-6">
    <h1 class="text-2xl font-semibold text-[--ml-text] mb-6">Minha conta</h1>

    <div id="account-content" class="hidden grid md:grid-cols-[280px_1fr] gap-6">
      <!-- Cartão de perfil -->
      <aside class="bg-white rounded-lg p-5 h-fit">
        <div class="flex flex-col items-center text-center">
          <img id="profile-avatar" src="" alt="Avatar" class="w-20 h-20 rounded-full object-cover bg-gray-100 mb-3" onerror="this.src=IMG_PLACEHOLDER" />
          <p id="profile-name" class="font-semibold text-[--ml-text]"></p>
          <p id="profile-email" class="text-xs text-[--ml-text-light]"></p>
          <span id="profile-level" class="mt-2 inline-block bg-blue-50 text-[--ml-blue] text-xs font-semibold px-2.5 py-1 rounded-full"></span>
        </div>
        <div class="grid grid-cols-3 gap-2 mt-5 text-center text-xs">
          <div class="bg-gray-50 rounded-md py-2">
            <p id="profile-coupons" class="font-semibold text-[--ml-text]">0</p>
            <p class="text-[--ml-text-light]">Cupons</p>
          </div>
          <div class="bg-gray-50 rounded-md py-2">
            <p id="profile-coins" class="font-semibold text-[--ml-text]">0</p>
            <p class="text-[--ml-text-light]">Moedas</p>
          </div>
          <div class="bg-gray-50 rounded-md py-2">
            <p id="profile-sales" class="font-semibold text-[--ml-text]">0</p>
            <p class="text-[--ml-text-light]">Compras</p>
          </div>
        </div>
        <button id="logout-btn-page" class="w-full mt-5 text-sm text-[--ml-red] font-medium hover:underline">Sair da conta</button>
      </aside>

      <!-- Conteúdo principal -->
      <div class="space-y-6">
        <!-- Editar perfil -->
        <section class="bg-white rounded-lg p-5">
          <h2 class="font-semibold text-[--ml-text] mb-4">Editar perfil</h2>
          <form id="profile-form" class="grid sm:grid-cols-2 gap-4">
            <div>
              <label class="text-xs font-medium text-[--ml-text-light]">Nome</label>
              <input id="edit-name" type="text" class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-[--ml-blue]" />
            </div>
            <div>
              <label class="text-xs font-medium text-[--ml-text-light]">URL do avatar</label>
              <input id="edit-avatar" type="text" placeholder="https://..." class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-[--ml-blue]" />
            </div>
            <div class="sm:col-span-2">
              <button type="submit" class="bg-[--ml-blue] hover:bg-blue-600 text-white text-sm font-semibold px-4 py-2 rounded-md transition">Salvar alterações</button>
            </div>
          </form>
        </section>

        <!-- Alterar senha -->
        <section class="bg-white rounded-lg p-5">
          <h2 class="font-semibold text-[--ml-text] mb-4">Alterar senha</h2>
          <form id="password-form" class="grid sm:grid-cols-2 gap-4">
            <div>
              <label class="text-xs font-medium text-[--ml-text-light]">Senha atual</label>
              <input id="current-password" type="password" required class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-[--ml-blue]" />
            </div>
            <div>
              <label class="text-xs font-medium text-[--ml-text-light]">Nova senha</label>
              <input id="new-password" type="password" required minlength="6" class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-[--ml-blue]" />
            </div>
            <div class="sm:col-span-2">
              <button type="submit" class="bg-[#EAF3FF] hover:bg-blue-100 text-[--ml-blue] text-sm font-semibold px-4 py-2 rounded-md transition">Atualizar senha</button>
            </div>
          </form>
        </section>

        <!-- Histórico de pedidos -->
        <section class="bg-white rounded-lg p-5">
          <h2 class="font-semibold text-[--ml-text] mb-4">Meus pedidos</h2>
          <div id="orders-list" class="space-y-3">
            <div class="skeleton h-16 rounded-md"></div>
          </div>
          <p id="orders-empty" class="hidden text-sm text-[--ml-text-light] text-center py-6">Você ainda não fez nenhum pedido.</p>
        </section>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/conta.js"></script>
</body>
</html>
