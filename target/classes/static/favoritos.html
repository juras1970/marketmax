<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favoritos — MarketMax</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        'ml-yellow': '#FFE600', 'ml-blue': '#3483FA', 'ml-green': '#00A650', 'ml-red': '#E63535',
      } } }
    }
  </script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="min-h-screen flex flex-col">

  <div id="site-header"></div>

  <main class="flex-1 w-full max-w-[1200px] mx-auto px-4 py-6">
    <h1 class="text-2xl font-semibold text-[--ml-text] mb-6">Meus favoritos</h1>

    <div id="favorites-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3"></div>

    <p id="favorites-empty" class="hidden text-center text-[--ml-text-light] py-20">
      Você ainda não favoritou nenhum produto.
      <a href="/index.html" class="block mt-2 text-[--ml-blue] hover:underline font-medium">Explorar produtos</a>
    </p>
  </main>

  <div id="site-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/product-card.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const grid = document.getElementById('favorites-grid');
      const empty = document.getElementById('favorites-empty');

      if (!auth.isLoggedIn()) {
        grid.innerHTML = '';
        empty.innerHTML = `
          Você precisa entrar na sua conta para ver seus favoritos.
          <a href="/login.html?redirect=%2Ffavoritos.html" class="block mt-2 text-[--ml-blue] hover:underline font-medium">Entrar</a>
        `;
        empty.classList.remove('hidden');
        return;
      }

      grid.innerHTML = Array(5).fill(skeletonCardHtml()).join('');
      try {
        const [favoriteIds, allProducts] = await Promise.all([
          api.favorites.list(),
          api.products.list(),
        ]);
        const favorites = allProducts.filter(p => favoriteIds.includes(p.id));
        if (favorites.length === 0) {
          grid.innerHTML = '';
          empty.classList.remove('hidden');
          return;
        }
        grid.innerHTML = favorites.map(p => productCardHtml(p, true)).join('');
      } catch (e) {
        grid.innerHTML = `<p class="col-span-full text-center text-[--ml-text-light] py-10">Não foi possível carregar os favoritos.</p>`;
      }
    });
  </script>
</body>
</html>
